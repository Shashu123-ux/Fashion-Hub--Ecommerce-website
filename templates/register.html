<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Fashion Hub</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/">
            <img src="/static/images/logo.png" alt="Fashion Hub" class="auth-logo" />
          </a>
          <h1 class="auth-title">Create your account</h1>
          <p class="auth-subtitle">Join us for a premium shopping experience.</p>
        </div>

        <form class="auth-form" id="registerForm">
          <div class="input-group">
            <label for="regName">Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="regName" placeholder="Your name" required />
            </div>
          </div>

          <div class="input-group">
            <label for="regEmail">Email</label>
            <div class="input-wrapper">
              <input type="email" id="regEmail" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="input-group">
            <label for="regPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="regPassword" placeholder="Create a password" required minlength="6" />
              <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="hint" style="font-size: 12px; margin-top: 4px;">Must be at least 6 characters.</div>
          </div>

          <div class="input-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required />
            </div>
            <div id="passwordMatchMsg" class="validation-msg">Passwords do not match</div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="regTerms" required />
            <label for="regTerms">I agree to the <a href="#" onclick="alert('Demo terms'); return false;" style="text-decoration: underline;">Terms & Privacy Policy</a>.</label>
          </div>

          <button class="auth-btn" type="submit">Register</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login">Login</a>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
