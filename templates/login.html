<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Fashion Hub</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/">
            <img src="/static/images/logo.png" alt="Fashion Hub" class="auth-logo" />
          </a>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Please enter your details to sign in.</p>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="input-group">
            <label for="loginEmail">Email</label>
            <div class="input-wrapper">
              <input type="email" id="loginEmail" placeholder="Enter your email" required />
            </div>
          </div>

          <div class="input-group">
            <label for="loginPassword">Password</label>
            <div class="input-wrapper">
              <input type="password" id="loginPassword" placeholder="Enter your password" required />
              <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" aria-label="Toggle password visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <a href="#" class="forgot-password" onclick="alert('This is a UI-only demo link.'); return false;">Forgot password?</a>

          <button class="auth-btn" type="submit">Continue to Fashion Hub</button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="/register">Sign up</a>
        </div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>
    <script src="/static/js/auth.js"></script>
  </body>
</html>
